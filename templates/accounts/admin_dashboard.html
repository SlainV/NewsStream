{% extends "base.html" %}

{% block content %}
<h2>Administrator Dashboard</h2>

<p>
    Manage application users and roles.
</p>

<table border="1">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>
            <a href="{% url 'admin_user_detail' user.id %}">
                View
            </a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">
            No users found.
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
