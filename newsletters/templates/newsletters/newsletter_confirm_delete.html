{% extends "base.html" %}

{% block content %}
<h1>Delete Newsletter</h1>

<p>
    Are you sure you want to delete
    <strong>{{ newsletter.title }}</strong>?
</p>

<p>
    This action cannot be undone.
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Delete Newsletter
    </button>

    <a href="{% url 'newsletters:newsletter_detail' newsletter.id %}">
        Cancel
    </a>
</form>
{% endblock %}
