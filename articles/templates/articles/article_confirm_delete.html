{% extends "base.html" %}

{% block content %}
<h1>Delete Article</h1>

<p>
    Are you sure you want to delete
    <strong>{{ article.title }}</strong>?
</p>

<p>
    This action cannot be undone.
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Delete Article
    </button>

    <a href="{% url 'article_detail' article.id %}">
        Cancel
    </a>
</form>
{% endblock %}
