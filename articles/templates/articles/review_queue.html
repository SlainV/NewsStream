{% extends "base.html" %}

{% block content %}

<h1>Review Queue</h1>

{% for article in articles %}
    <p>
        {{ article.title }}
        -
        {{ article.author.username }}

        <a href="{% url 'review_article' article.id %}">
            Review
        </a>
    </p>
{% empty %}
    <p>No articles awaiting review.</p>
{% endfor %}

{% endblock %}
